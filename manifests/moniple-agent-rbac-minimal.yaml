# =============================================================================
# moniple-agent READ-ONLY RBAC (no install, no remediation)
# =============================================================================
# WHEN TO USE THIS:
#   Use this manifest INSTEAD OF `moniple-agent-rbac.yaml` when you run the
#   agent with AUTO_INSTALL_MONITORING=false, you pre-install the monitoring
#   stack (VictoriaMetrics/vmagent + kube-state-metrics + node-exporter) and
#   its RBAC yourself, AND you never want the agent to change anything.
#
# HOW IT DIFFERS FROM THE DEFAULT (`moniple-agent-rbac.yaml`):
#   The default manifest is ALSO least-privilege — no cluster-wide secrets, no
#   RBAC write, no cluster-wide workload create. It additionally grants
#     (a) a namespaced Role for installing the monitoring stack, and
#     (b) five cluster-wide remediation verbs (delete pods, patch nodes/PVCs/
#         deployments, delete jobs) used ONLY by Doctor actions you approve.
#   This variant drops both: every rule below is get/list/watch.
#
# CONSEQUENCES (both are visible in the agent log, neither crashes it):
#   - Auto-install fails with permission errors → keep
#     AUTO_INSTALL_MONITORING=false and PROMETHEUS_API_URL pointed at your
#     own stack.
#   - Approved Doctor remediation actions fail with a permission error and are
#     reported back to the app as failed executions.
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moniple-agent
  namespace: moniple
  labels:
    app: moniple-agent
    managed-by: moniple-agent
    variant: minimal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: moniple-agent
  labels:
    app: moniple-agent
    managed-by: moniple-agent
    variant: minimal
rules:
  # Core resources — read-only for metric collection + Doctor diagnostics
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      # Doctor reads the last log lines of crashing pods to explain failures.
      - pods/log
      - persistentvolumeclaims
      - events
    verbs: ["get", "list", "watch"]
  # events also live under events.k8s.io on modern clusters
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Apps resources — read-only for workload summaries
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  # StorageClass read: the PVC checks report whether a volume is expandable.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # Read-only view of RBAC policy objects, so the agent can report whether the
  # monitoring stack's ClusterRoles exist. Exposes no credential.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  # Lets the agent ask the API server what it may do instead of finding out
  # through 403s (it then skips the write paths quietly).
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: moniple-agent
  labels:
    app: moniple-agent
    managed-by: moniple-agent
    variant: minimal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: moniple-agent
subjects:
  - kind: ServiceAccount
    name: moniple-agent
    namespace: moniple
