---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moniple-kube-state-metrics
  namespace: moniple
  labels:
    app: moniple-kube-state-metrics
    managed-by: moniple-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: moniple-kube-state-metrics
  labels:
    app: moniple-kube-state-metrics
    managed-by: moniple-agent
# Scoped to exactly the objects Moniple reads. Every PromQL query in the
# agent (lib/queries.js) and the server uses only:
#   kube_namespace_status_phase, kube_node_info, kube_node_status_allocatable,
#   kube_pod_info/_owner/_status_phase/_container_status_restarts_total/
#   _container_status_waiting_reason, kube_persistentvolumeclaim_info/
#   _resource_requests_storage_bytes, kube_replicaset_owner.
# The Deployment below is started with a matching --resources flag, so KSM
# does not try to watch anything this role withholds.
# The default kube-state-metrics role includes cluster-wide `secrets: list`,
# which is cluster-admin-equivalent (ServiceAccount tokens are Secrets) — it
# is deliberately absent. Do not re-add a resource here without also adding it
# to --resources AND actually querying it.
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - persistentvolumeclaims
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: moniple-kube-state-metrics
  labels:
    app: moniple-kube-state-metrics
    managed-by: moniple-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: moniple-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: moniple-kube-state-metrics
    namespace: moniple
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moniple-kube-state-metrics
  namespace: moniple
  labels:
    app: moniple-kube-state-metrics
    managed-by: moniple-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moniple-kube-state-metrics
  template:
    metadata:
      labels:
        app: moniple-kube-state-metrics
    spec:
      serviceAccountName: moniple-kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.10.1
          args:
            # Must stay in sync with the ClusterRole above: KSM logs a
            # permission error for every collector it cannot watch, so the
            # resource list and the RBAC rules are one contract.
            - --resources=namespaces,nodes,persistentvolumeclaims,pods,replicasets
          ports:
            - containerPort: 8080
              name: http-metrics
            - containerPort: 8081
              name: telemetry
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: moniple-kube-state-metrics
  namespace: moniple
  labels:
    app: moniple-kube-state-metrics
    managed-by: moniple-agent
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http-metrics
      name: http-metrics
    - port: 8081
      targetPort: telemetry
      name: telemetry
  selector:
    app: moniple-kube-state-metrics
