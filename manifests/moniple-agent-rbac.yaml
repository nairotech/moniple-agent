# =============================================================================
# moniple-agent FULL RBAC (auto-install variant)
# =============================================================================
# WARNING: This ClusterRole is effectively CLUSTER-ADMIN-EQUIVALENT. It grants
# cluster-wide write on `secrets` and full management of
# `clusterroles`/`clusterrolebindings`. This breadth is REQUIRED ONLY when the
# agent runs with AUTO_INSTALL_MONITORING=true (the default), because the agent:
#
#   (a) bootstraps the kube-state-metrics RBAC during auto-install — it must
#       create the KSM ServiceAccount, ClusterRole and ClusterRoleBinding, and
#       reconcile Secrets/ConfigMaps for the monitoring stack; and
#   (b) satisfies managed-Kubernetes RBAC-escalation protection (GKE/EKS/AKS):
#       a subject can only GRANT permissions it ALREADY HOLDS. So to create the
#       KSM ClusterRole (which needs broad list/watch across many API groups),
#       the agent's own ClusterRole must itself hold every one of those grants —
#       otherwise the API server rejects the creation with a 403 escalation
#       error.
#
# If you pre-install your monitoring stack yourself and set
# AUTO_INSTALL_MONITORING=false, prefer the least-privilege variant in
# `moniple-agent-rbac-minimal.yaml` instead (read-only, no secrets, no RBAC
# write). Do NOT narrow the rules below while auto-install is enabled — doing so
# breaks installs on managed clusters via the escalation protection above.
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moniple-agent
  namespace: moniple
  labels:
    app: moniple-agent
    managed-by: moniple-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: moniple-agent
  labels:
    app: moniple-agent
    managed-by: moniple-agent
rules:
  # Core resources - agent install + kube-state-metrics delegation
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - nodes/proxy
      - nodes/metrics
      - pods
      - services
      - endpoints
      - serviceaccounts
      - configmaps
      # secrets (cluster-wide write): needed to create/reconcile the monitoring
      # stack's secrets during auto-install. This is the single most sensitive
      # grant here — drop it (use the minimal variant) if you pre-install
      # monitoring yourself.
      - secrets
      - persistentvolumeclaims
      - persistentvolumes
      - resourcequotas
      - replicationcontrollers
      - limitranges
      # Doctor reads cluster events (core API) to explain pod failures /
      # scheduling issues. Without this the events check 403s.
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # events also live under events.k8s.io on modern clusters — read there too.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Batch resources (kube-state-metrics needs)
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["list", "watch"]
  # Autoscaling (kube-state-metrics needs)
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["list", "watch"]
  # Auth (kube-state-metrics needs)
  - apiGroups: ["authentication.k8s.io"]
    resources:
      - tokenreviews
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources:
      - subjectaccessreviews
    verbs: ["create"]
  # Policy (kube-state-metrics needs)
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["list", "watch"]
  # Certificates (kube-state-metrics needs)
  - apiGroups: ["certificates.k8s.io"]
    resources:
      - certificatesigningrequests
    verbs: ["list", "watch"]
  # Discovery (kube-state-metrics needs)
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["list", "watch"]
  # Storage (kube-state-metrics needs)
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - volumeattachments
    verbs: ["get", "list", "watch"]
  # Admission (kube-state-metrics needs)
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
    verbs: ["list", "watch"]
  # Networking (kube-state-metrics needs)
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingressclasses
      - ingresses
    verbs: ["list", "watch"]
  # Coordination (kube-state-metrics needs)
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["list", "watch"]
  # RBAC management - agent creates roles for kube-state-metrics and vmagent.
  # Required for auto-install: the agent provisions the KSM/vmagent
  # ClusterRoles + bindings. Combined with the broad grants above, this also
  # satisfies GKE/EKS/AKS escalation protection (the agent can only grant what
  # it already holds). Remove this rule only with AUTO_INSTALL_MONITORING=false
  # (see moniple-agent-rbac-minimal.yaml).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
      - clusterrolebindings
      - roles
      - rolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Metrics endpoints (vmagent scraping)
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: moniple-agent
  labels:
    app: moniple-agent
    managed-by: moniple-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: moniple-agent
subjects:
  - kind: ServiceAccount
    name: moniple-agent
    namespace: moniple
