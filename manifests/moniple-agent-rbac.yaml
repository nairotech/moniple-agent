# =============================================================================
# moniple-agent RBAC (least privilege)
# =============================================================================
# This is the reference copy of what the Moniple install manifest
# (`GET https://server.moniple.com/install/agent.yaml?key=mk_...`) applies —
# keep the two IN SYNC. The install manifest is applied WITH THE OPERATOR'S
# CREDENTIALS, which is what lets the agent itself stay narrow:
#
#   * NO cluster-wide `secrets`. That single grant is cluster-admin-equivalent
#     (every ServiceAccount token in the cluster is a Secret). The installer's
#     Secret access is namespaced to the install namespace via the Role below.
#   * NO write on rbac.authorization.k8s.io. The monitoring stack's RBAC
#     (kube-state-metrics, vmagent) ships in the install manifest and is
#     created by the operator, so managed-Kubernetes escalation protection
#     (GKE/EKS/AKS: "a subject may only grant what it already holds") is
#     satisfied without the agent holding those permissions.
#   * NO cluster-wide create/update on workloads. The installer writes only in
#     the install namespace (Role below). The only cluster-wide writes are the
#     Doctor remediation verbs, and they run exclusively on actions a user
#     approves in the app.
#
# HISTORY: before 2026-08-13 this ClusterRole granted cluster-wide `secrets`
# plus full RBAC management, and the agent re-applied it to itself on every
# start ("self-heal") — meaning an image update could widen its own privileges
# without the operator's consent. Both are gone. Missing permissions are now
# reported in the agent log with an instruction to re-apply the install YAML.
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moniple-agent
  namespace: moniple
  labels:
    app: moniple-agent
    managed-by: moniple-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: moniple-agent
  labels:
    app: moniple-agent
    managed-by: moniple-agent
rules:
  # --- Read: metric collection + Doctor diagnostics ---
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      # Doctor reads the last log lines of crashing pods to explain failures.
      - pods/log
      - persistentvolumeclaims
      # Doctor reads cluster events (core API) to explain pod failures /
      # scheduling issues. Without this the events check 403s.
      - events
    verbs: ["get", "list", "watch"]
  # events also live under events.k8s.io on modern clusters — read there too.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  # StorageClass read: the expand_pvc action must check allowVolumeExpansion
  # before it patches a PVC.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # Read-only view of RBAC policy objects: the agent checks whether the
  # monitoring stack's ClusterRoles exist so it can tell the operator to
  # re-apply the install manifest. Reading a policy object exposes no
  # credential and grants no privilege.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  # The agent asks the API server what it may do (SelfSubjectAccessReview)
  # instead of discovering its own permissions through 403 errors.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
  # --- Write: ONLY the Doctor remediation actions a user approves in the app.
  # Delete the five rules below for a strictly read-only agent; approved
  # remediation then fails with a permission error and nothing else changes.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: moniple-agent
  labels:
    app: moniple-agent
    managed-by: moniple-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: moniple-agent
subjects:
  - kind: ServiceAccount
    name: moniple-agent
    namespace: moniple
---
# Installer permissions, scoped to the install namespace only. The agent
# creates the monitoring stack (VictoriaMetrics, vmagent, kube-state-metrics,
# node-exporter) here and nowhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: moniple-agent
  namespace: moniple
  labels:
    app: moniple-agent
    managed-by: moniple-agent
rules:
  - apiGroups: [""]
    resources:
      - serviceaccounts
      - configmaps
      - services
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Secrets: install namespace ONLY, and only the verbs the installer uses.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moniple-agent
  namespace: moniple
  labels:
    app: moniple-agent
    managed-by: moniple-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: moniple-agent
subjects:
  - kind: ServiceAccount
    name: moniple-agent
    namespace: moniple
