---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moniple-node-exporter
  namespace: moniple
  labels:
    app: moniple-node-exporter
    managed-by: moniple-agent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: moniple-node-exporter
  namespace: moniple
  labels:
    app: moniple-node-exporter
    managed-by: moniple-agent
spec:
  selector:
    matchLabels:
      app: moniple-node-exporter
  template:
    metadata:
      labels:
        app: moniple-node-exporter
    spec:
      serviceAccountName: moniple-node-exporter
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.7.0
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --web.listen-address=:9101
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/kubelet/.+|boot|snap)($|/)
            - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|tmpfs)$
          ports:
            - containerPort: 9101
              hostPort: 9101
              name: metrics
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
        - operator: Exists
          effect: PreferNoSchedule
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
---
apiVersion: v1
kind: Service
metadata:
  name: moniple-node-exporter
  namespace: moniple
  labels:
    app: moniple-node-exporter
    managed-by: moniple-agent
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9101"
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 9101
      targetPort: metrics
      name: metrics
  selector:
    app: moniple-node-exporter
