{{- if index .Values "victoria-metrics" "enabled" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moniple-agent.fullname" . }}-vmagent-config
  labels:
    {{- include "moniple-agent.labels" . | nindent 4 }}
data:
  scrape.yaml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s

    scrape_configs:
      # Scrape kube-state-metrics
      {{- if index .Values "kube-state-metrics" "enabled" }}
      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - {{ .Release.Name }}-kube-state-metrics:8080
        metric_relabel_configs:
          # Keep only needed metrics to reduce storage
          - source_labels: [__name__]
            regex: 'kube_(pod|node|namespace|deployment|daemonset|statefulset|persistentvolumeclaim|resourcequota)_.*'
            action: keep
      {{- end }}

      # Scrape node-exporter
      {{- if index .Values "node-exporter" "enabled" }}
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - {{ .Release.Namespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoints_name]
            regex: {{ .Release.Name }}-prometheus-node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node
        metric_relabel_configs:
          # Keep only needed metrics
          - source_labels: [__name__]
            regex: 'node_(cpu|memory|disk|filesystem|network)_.*'
            action: keep
      {{- end }}

      # Scrape kubelet cAdvisor for container metrics
      - job_name: kubelet-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          # Keep only container metrics we need
          - source_labels: [__name__]
            regex: 'container_(cpu|memory|network|fs)_.*'
            action: keep
          # Drop metrics for pause containers
          - source_labels: [container]
            regex: 'POD|'
            action: drop

      # Scrape kubelet metrics
      - job_name: kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'kubelet_(running|node|pod|volume)_.*'
            action: keep
{{- end }}
