name: Build and Push

on:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Stamp the build with a unix timestamp. This becomes the agent's reported
      # version (AGENT_BUILD_DATE) AND the immutable image tag (v<ts>), so the
      # in-app "agent update available" feature can compare versions and the
      # update_agent self-update can pull nairotech/moniple-agent:v<ts>.
      - name: Compute build timestamp
        id: build_ts
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            AGENT_BUILD_DATE=${{ steps.build_ts.outputs.ts }}
          tags: |
            nairotech/moniple-agent:main
            nairotech/moniple-agent:latest
            nairotech/moniple-agent:v${{ steps.build_ts.outputs.ts }}
